components:
  schemas:
    BankAccount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        opening_date:
          type: string
          format: date
        calculated_balance:
          type: number
          format: double
          maximum: 1000000000000
          minimum: -1000000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
      required:
      - calculated_balance
      - id
      - opening_balance
      - opening_date
    BankReconciliation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        actual_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        calculated_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        variance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actual_balance
      - calculated_balance
      - created_at
      - date
      - id
      - variance
    DirectionEnum:
      enum:
      - credit
      - debit
      type: string
      description: |-
        * `credit` - Credit
        * `debit` - Debit
    EntryTypeEnum:
      enum:
      - income
      - household_expense
      - personal_expense
      - adjustment
      type: string
      description: |-
        * `income` - Income
        * `household_expense` - Household expense
        * `personal_expense` - Personal expense
        * `adjustment` - Bank adjustment
    ExpenseSetup:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        expected_amount:
          type: number
          format: double
          maximum: 1000000000000
          minimum: 0.01
          exclusiveMaximum: true
        due_day:
          type: integer
          maximum: 31
          minimum: 1
        reminder_lead_days:
          type: integer
          maximum: 31
          minimum: 0
          default: 3
      required:
      - due_day
      - expected_amount
      - name
    Household:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        owner:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        currency:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        monthly_savings_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        savings_reminder_day:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        onboarding_complete:
          type: boolean
          readOnly: true
      required:
      - currency
      - id
      - name
      - onboarding_complete
      - owner
      - timezone
    IncomeSetup:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        amount:
          type: number
          format: double
          maximum: 1000000000000
          minimum: 0.01
          exclusiveMaximum: true
      required:
      - amount
      - name
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        invite_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - expires_at
      - id
      - invite_url
      - status
    LedgerEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        period:
          type: integer
        planned_income:
          type: integer
          nullable: true
        planned_expense:
          type: integer
          nullable: true
        entry_type:
          $ref: '#/components/schemas/EntryTypeEnum'
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        date:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 160
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - date
      - description
      - direction
      - entry_type
      - id
      - period
      - updated_at
    Membership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - role
      - user
    MonthlyIncomePlan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        planned_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        received_amount:
          type: number
          format: double
          readOnly: true
      required:
      - id
      - name
      - planned_amount
      - received_amount
    MonthlyPeriod:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        month:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        label:
          type: string
          readOnly: true
        savings_target:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        income_plans:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyIncomePlan'
          readOnly: true
        planned_expenses:
          type: array
          items:
            $ref: '#/components/schemas/PlannedExpense'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - income_plans
      - label
      - month
      - planned_expenses
      - updated_at
      - year
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/NotificationKindEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        action_url:
          type: string
          readOnly: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
