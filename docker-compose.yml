services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance_manager
      POSTGRES_USER: finance_manager
      POSTGRES_PASSWORD: finance_manager
    ports:
      - "5432:5432"
    volumes:
      - finance_manager_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance_manager_postgres:
